; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ── 2.8" target (ESP32-2432S028R) ────────────────────────────────────────
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    lvgl/lvgl@8.3.9
    https://github.com/knolleary/pubsubclient.git
    ArduinoJson@6.21.5
    FS
    SD
    https://github.com/PaulStoffregen/OneWire.git
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
build_flags =
  -D__XTOUCH_SCREEN_28__
  !python3 scripts/version.py
extra_scripts =
    scripts/pre-build.py
    scripts/post-build.py

; ── 5" target (JC8048W550C / Guition ESP32-S3 800×480) ──────────────────
; Flash via USB-C while holding the BOOT button on the board.
[env:esp32s3-5inch]
platform = espressif32
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Flash & partition layout for 16 MB flash + 8 MB OPI PSRAM
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
board_build.arduino.memory_type = qio_opi
board_build.extra_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    https://github.com/moononournation/Arduino_GFX.git
    https://github.com/tamctec/gt911-arduino.git
    lvgl/lvgl@8.3.9
    https://github.com/knolleary/pubsubclient.git
    ArduinoJson@6.21.5
    FS
    SD
    https://github.com/PaulStoffregen/OneWire.git
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git

build_flags =
    -D__XTOUCH_SCREEN_55__
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DBOARD_HAS_PSRAM
    -DLV_MEM_SIZE="(128*1024U)"
    !python3 scripts/version.py

extra_scripts =
    scripts/pre-build.py
    scripts/post-build.py

